name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  routes:
    name: both routes (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12']
        include:
          - os: ubuntu-latest
            python: '3.10'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: SHA256SUMS, the Python route, and the base R route
        run: python run_all.py --require-r

  rebuild:
    name: rebuild the data from predict v1.0.1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Clone the public Tonmick files
        run: git clone --depth 1 --branch v1.0.1 https://github.com/nicholaskarlson/predict.git build/predict
      - name: Rebuild and compare, byte for byte
        run: python -I python/make_data.py build/predict --check
